name: Bootstrap npm beta publish

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Exact npm version approved for bootstrap publication
        required: true
        default: 0.1.0-beta.1
        type: string
      expected_commit:
        description: Exact 40-character main commit approved for publication
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: bootstrap-npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Bootstrap npm publish
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: npm-bootstrap

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js 24
        # Temporary exact pin to the merged upstream security fix for
        # GHSA-3jxr-9vmj-r5cp until setup-node publishes a patched release.
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Require exact reviewed main commit
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Bootstrap publication must run from main" >&2
            exit 1
          fi

          if ! printf '%s' "$EXPECTED_COMMIT" |
             grep -Eq '^[0-9a-f]{40}$'
          then
            echo "expected_commit must be an exact lowercase 40-character SHA" >&2
            exit 1
          fi

          if [ "$GITHUB_SHA" != "$EXPECTED_COMMIT" ]; then
            echo "Workflow SHA does not equal the reviewed release commit" >&2
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "Checkout HEAD does not equal GITHUB_SHA" >&2
            exit 1
          fi

          echo "reviewed_commit=$GITHUB_SHA"

      - name: Runtime versions
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          git --version

      - name: Validate exact bootstrap manifest
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8"),
          );

          const expectedVersion = process.env.EXPECTED_VERSION;

          if (expectedVersion !== "0.1.0-beta.1") {
            throw new Error(
              `bootstrap workflow only authorizes 0.1.0-beta.1, got ${expectedVersion}`,
            );
          }

          if (pkg.name !== "@changeproof/cli") {
            throw new Error(`unexpected package name: ${pkg.name}`);
          }

          if (pkg.version !== expectedVersion) {
            throw new Error(
              `version mismatch: expected ${expectedVersion}, got ${pkg.version}`,
            );
          }

          if (Object.prototype.hasOwnProperty.call(pkg, "private")) {
            throw new Error("package manifest is still publication-locked");
          }

          if (pkg.publishConfig?.access !== "public") {
            throw new Error("public package access contract missing");
          }

          if (
            pkg.repository?.url !==
            "git+https://github.com/puffynNeroun/change-proof.git"
          ) {
            throw new Error("canonical repository metadata mismatch");
          }

          if (pkg.engines?.node !== ">=24") {
            throw new Error("unexpected Node.js engine contract");
          }

          if (pkg.bin?.["change-proof"] !== "bin/change-proof.mjs") {
            throw new Error("unexpected executable mapping");
          }

          if (Object.keys(pkg.dependencies ?? {}).length !== 0) {
            throw new Error("unexpected runtime dependencies");
          }

          if (Object.keys(pkg.devDependencies ?? {}).length !== 0) {
            throw new Error("unexpected development dependencies");
          }

          console.log("bootstrap_manifest=PASS");
          NODE

      - name: Verify canonical public repository security state
        shell: bash
        run: |
          set -euo pipefail

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            https://api.github.com/repos/puffynNeroun/change-proof \
            > "$tmp_dir/repository.json"

          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            https://api.github.com/repos/puffynNeroun/change-proof/private-vulnerability-reporting \
            > "$tmp_dir/pvr.json"

          node - \
            "$tmp_dir/repository.json" \
            "$tmp_dir/pvr.json" <<'NODE'
          const fs = require("node:fs");

          const repository = JSON.parse(
            fs.readFileSync(process.argv[2], "utf8"),
          );

          const pvr = JSON.parse(
            fs.readFileSync(process.argv[3], "utf8"),
          );

          if (
            repository.full_name !==
            "puffynNeroun/change-proof"
          ) {
            throw new Error(
              "canonical GitHub repository mismatch",
            );
          }

          if (
            repository.private !== false ||
            repository.visibility !== "public"
          ) {
            throw new Error(
              "canonical source repository is not public",
            );
          }

          if (pvr.enabled !== true) {
            throw new Error(
              "GitHub Private Vulnerability Reporting is not enabled",
            );
          }

          console.log("public_repository=PASS");
          console.log("private_vulnerability_reporting=PASS");
          console.log("repository_security_state=PASS");
          NODE

      - name: Require package to be brand new
        shell: bash
        run: |
          set -euo pipefail

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          if npm view @changeproof/cli version --json \
            >"$tmp_dir/out" 2>"$tmp_dir/err"
          then
            echo "@changeproof/cli already exists; bootstrap workflow must never be reused" >&2
            cat "$tmp_dir/out"
            exit 1
          fi

          if grep -q 'E404' "$tmp_dir/out" ||
             grep -q 'E404' "$tmp_dir/err"
          then
            echo "registry_package_state=UNPUBLISHED"
          else
            cat "$tmp_dir/out" >&2 || true
            cat "$tmp_dir/err" >&2 || true
            echo "Unexpected npm registry failure" >&2
            exit 1
          fi

      - name: Require candidate tag to be absent
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        shell: bash
        run: |
          set -euo pipefail

          tag="v$EXPECTED_VERSION"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Release tag already exists: $tag" >&2
            exit 1
          fi

          echo "release_tag_state=ABSENT"

      - name: Full regression suite
        run: npm test

      - name: Validate exact package projection
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        shell: bash
        run: |
          set -euo pipefail

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          npm pack --dry-run --ignore-scripts --json > "$tmp_dir/pack.json"

          node - "$tmp_dir/pack.json" <<'NODE'
          const fs = require("node:fs");

          const data = JSON.parse(
            fs.readFileSync(process.argv[2], "utf8"),
          );

          if (!Array.isArray(data) || data.length !== 1) {
            throw new Error("expected one package projection");
          }

          const pack = data[0];

          if (pack.name !== "@changeproof/cli") {
            throw new Error(`unexpected package: ${pack.name}`);
          }

          if (pack.version !== process.env.EXPECTED_VERSION) {
            throw new Error(`unexpected version: ${pack.version}`);
          }

          if (pack.entryCount !== 18) {
            throw new Error(
              `unexpected package inventory: ${pack.entryCount}`,
            );
          }

          if (
            !Array.isArray(pack.bundled) ||
            pack.bundled.length !== 0
          ) {
            throw new Error("unexpected bundled dependencies");
          }

          console.log(`package=${pack.name}@${pack.version}`);
          console.log(`entries=${pack.entryCount}`);
          console.log(`size=${pack.size}`);
          console.log(`unpacked_size=${pack.unpackedSize}`);
          console.log("package_projection=PASS");
          NODE

      - name: Verify bootstrap npm credential
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_BOOTSTRAP_TOKEN is not configured" >&2
            exit 1
          fi

          npm_user="$(
            npm whoami --registry=https://registry.npmjs.org/
          )"

          if [ "$npm_user" != "puffynneroun" ]; then
            echo "Unexpected npm bootstrap identity: $npm_user" >&2
            exit 1
          fi

          echo "npm_bootstrap_identity=$npm_user"

      - name: Publish initial public beta with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          npm publish \
            --registry=https://registry.npmjs.org/ \
            --access public \
            --tag beta \
            --provenance \
            --ignore-scripts

      - name: Verify registry publication and dist-tag
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        shell: bash
        run: |
          set -euo pipefail

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          found=0

          for attempt in $(seq 1 240); do
            if npm view "@changeproof/cli@$EXPECTED_VERSION" \
              name version repository license \
              --json \
              > "$tmp_dir/version.json" 2>/dev/null
            then
              if npm view @changeproof/cli dist-tags \
                --json \
                > "$tmp_dir/tags.json" 2>/dev/null
              then
                found=1
                break
              fi
            fi

            echo "waiting_for_registry attempt=$attempt/240"
            sleep 5
          done

          if [ "$found" -ne 1 ]; then
            echo "Published package did not become readable from the registry" >&2
            exit 1
          fi

          node - \
            "$tmp_dir/version.json" \
            "$tmp_dir/tags.json" <<'NODE'
          const fs = require("node:fs");

          const metadata = JSON.parse(
            fs.readFileSync(process.argv[2], "utf8"),
          );

          const tags = JSON.parse(
            fs.readFileSync(process.argv[3], "utf8"),
          );

          const expected = process.env.EXPECTED_VERSION;

          if (metadata.name !== "@changeproof/cli") {
            throw new Error("registry package name mismatch");
          }

          if (metadata.version !== expected) {
            throw new Error("registry version mismatch");
          }

          if (metadata.license !== "Apache-2.0") {
            throw new Error("registry license mismatch");
          }

          if (tags.beta !== expected) {
            throw new Error(
              `beta dist-tag mismatch: ${JSON.stringify(tags)}`,
            );
          }

          if (Object.prototype.hasOwnProperty.call(tags, "latest")) {
            throw new Error(
              `unexpected latest dist-tag: ${JSON.stringify(tags)}`,
            );
          }

          console.log(`registry_package=@changeproof/cli@${expected}`);
          console.log(`beta_dist_tag=${tags.beta}`);
          console.log("latest_dist_tag=ABSENT");
          console.log("bootstrap_registry_verification=PASS");
          NODE
